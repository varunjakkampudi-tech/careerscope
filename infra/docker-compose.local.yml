name: careerscope-local

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    image: careerscope:local
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: '8080'
      DATA_DIR: /app/data
      SERVE_WEB: 'true'
      WEB_DIST: /app/apps/web/dist
      AUTH_DISABLED: 'false'
      LOGIN_ENABLED: 'true'
      AUTH_ORIGIN: http://localhost:5180
      TRUST_PROXY: 'false'
      CORS_ORIGINS: ''
      ENABLE_SCRAPERS: 'false'
      ENABLE_APPLICATION_AGENT: 'false'
      ENABLE_LLM_RERANK: ${LOCAL_LLM_ENABLED:-false}
      LLM_PROVIDER: ollama
      LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:1.5b-instruct-q4_K_M}
      OLLAMA_ORIGIN: http://ollama:11434
      SEARCH_CONCURRENCY: '2'
    ports:
      - '127.0.0.1:5180:8080'
    volumes:
      - local-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  ollama:
    image: ollama/ollama:0.11.10
    profiles: [llm]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - local-models:/root/.ollama
    expose:
      - '11434'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 6g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  local-data:
  local-models:
