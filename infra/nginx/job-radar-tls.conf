# Job Radar — nginx reverse proxy, TLS.
#
# Mount this in place of job-radar.conf once certbot has issued a certificate.
# Not the default, because nginx refuses to start when `ssl_certificate`
# points at a file that does not exist — so shipping this as the initial
# config would make the container crash-loop before the cert it needs could
# ever be obtained.
#
# Replace jobs.example.com in all four places below.

upstream job_radar_api {
    # Docker Compose: `api` is the service name on the compose network.
    server api:8080;

    # systemd / host-installed nginx: comment the line above, uncomment this.
    # server 127.0.0.1:8080;

    keepalive 16;
}

# Port 80 stays up: renewal needs it, and a redirect is friendlier than a
# refused connection for anyone who types the bare hostname.
server {
    listen 80;
    listen [::]:80;
    server_name jobs.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jobs.example.com;

    ssl_certificate     /etc/letsencrypt/live/jobs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobs.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The API's helmet middleware already sets HSTS, X-Content-Type-Options,
    # Referrer-Policy and the CSP. Repeating them here would either duplicate
    # the headers or, worse, quietly disagree with them.

    include /etc/nginx/conf.d/locations.inc;
}
