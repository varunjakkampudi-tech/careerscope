# Job Radar — nginx reverse proxy, plain HTTP.
#
# This is the default config, and the one a first `docker compose up` uses. It
# works immediately, with no certificate, which is what makes the initial ACME
# challenge possible: certbot needs to answer an HTTP request on port 80
# before it will issue anything.
#
# Once a certificate exists, switch compose to mount job-radar-tls.conf
# instead — a one-line change, documented in docs/RUNBOOK.md.
#
# ## What this serves
#
# Everything is proxied, including the SPA's static assets. The API serves the
# bundle itself (SERVE_WEB=true), which is why there is no `root` and no
# `try_files` here. Serving assets from nginx would be marginally faster and
# would reintroduce exactly the split-brain this shape avoids: nginx owning
# client-side route fallback while the API owns /api, the two obliged to agree
# forever about which paths are which. The API already has one not-found
# handler that returns index.html for non-/api GETs and JSON otherwise.

upstream job_radar_api {
    # Docker Compose: `api` is the service name on the compose network.
    server api:8080;

    # systemd / host-installed nginx: comment the line above, uncomment this.
    # server 127.0.0.1:8080;

    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot's webroot plugin writes challenge files here, and this must stay
    # reachable over plain HTTP forever — it is how renewal proves the domain,
    # not just how issuance does.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "TLS setup required. Complete certificate installation before using Job Radar.\n";
        add_header Content-Type text/plain always;
        add_header Cache-Control no-store always;
    }
}
