name: careerscope
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: careerscope
      POSTGRES_USER: careerscope
      POSTGRES_PASSWORD: ${CAREERSCOPE_DATABASE_PASSWORD:?Run the local setup script first}
    ports: ['127.0.0.1:55433:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careerscope -d careerscope']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1
  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?Run the local setup script first}',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run the local setup script first}
    ports: ['127.0.0.1:56479:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    cpus: 1
  redis-queue:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?Run the local setup script first}',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory',
        '192mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run the local setup script first}
    ports: ['127.0.0.1:56480:6379']
    volumes: ['queue-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    cpus: 1
volumes:
  postgres-data:
  queue-data:
