name: careerscope

# Single-host production topology. A long-lived network-anchor owns the shared
# namespace and the only host-published edge ports. Every application service,
# including the proxy, joins that namespace and binds loopback, so Postgres,
# Redis, the queue, the API and the web server have no reachable address from
# outside the host.
#
# Keeping namespace ownership separate from Caddy means a proxy restart cannot
# orphan healthy dependents in a dead namespace. Replacing the anchor remains a
# deliberate full-stack operation because it necessarily replaces the namespace.

# Images are explicit and required: CAREERSCOPE_IMAGE (runtime) and CAREERSCOPE_PROXY_IMAGE (proxy)
# have no default, so a mutable local tag can never be deployed by accident. Set them in infra/.env to
# an immutable reference (name@sha256:<digest> or a revision tag such as careerscope:<commit>);
# see docs/operations/DEPLOYMENT.md.

x-hardening: &hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  restart: unless-stopped
  tmpfs: ['/tmp:size=64m,mode=1777']
  stop_grace_period: 20s
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '5' }

x-environment: &environment
  DATABASE_URL: postgres://careerscope:${POSTGRES_PASSWORD:?Database password required}@127.0.0.1:5432/careerscope
  REDIS_URL: redis://:${REDIS_PASSWORD:?Redis password required}@127.0.0.1:6379
  QUEUE_REDIS_URL: redis://:${REDIS_PASSWORD:?Redis password required}@127.0.0.1:6380
  APP_ORIGIN: ${APP_ORIGIN:?Public origin required}
  DEPLOYMENT_ENVIRONMENT: production
  REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
  RESUME_STORAGE_DIRECTORY: /private/objects
  RESUME_STORAGE_KEY_FILE: /private/encryption.key
  NODE_OPTIONS: --max-old-space-size=512

# CS-34: the web service is a Next.js server that proxies /api/* to a
# hardcoded loopback address (apps/web/next.config.ts) and reads no other
# environment variable at all - not DATABASE_URL, not the resume storage
# encryption key path, not the persistent Redis queue endpoint. It inherited the
# full *environment anchor purely because it shares the *app anchor with
# api/publisher/search/files, which do need all of those. This is its own,
# deliberately minimal environment: only NODE_OPTIONS, which is generic Node
# process tuning, not application configuration or a credential, plus the
# deployment marker every service carries.
x-web-environment: &web-environment
  NODE_OPTIONS: --max-old-space-size=512
  DEPLOYMENT_ENVIRONMENT: production

x-app: &app
  <<: *hardening
  image: ${CAREERSCOPE_IMAGE:?Runtime image required (immutable digest or revision tag)}
  user: '1000:1000'
  network_mode: service:network-anchor
  environment: *environment
  cpus: 1
  mem_limit: 640m
  depends_on:
    bootstrap: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
    redis-queue: { condition: service_healthy }

services:
  network-anchor:
    <<: *hardening
    image: ${CAREERSCOPE_PROXY_IMAGE:?Proxy image required (immutable digest or revision tag)}
    user: '1000:1000'
    command: ['sh', '-c', 'exec tail -f /dev/null']
    environment:
      DEPLOYMENT_ENVIRONMENT: production
    ports:
      - '80:80'
      - '443:443'

  proxy:
    <<: *hardening
    image: ${CAREERSCOPE_PROXY_IMAGE:?Proxy image required (immutable digest or revision tag)}
    user: '1000:1000'
    # Restored only so the proxy can bind 80 and 443 as an unprivileged user.
    cap_add: [NET_BIND_SERVICE]
    network_mode: service:network-anchor
    depends_on:
      network-anchor: { condition: service_started }
    environment:
      DEPLOYMENT_ENVIRONMENT: production
      CAREERSCOPE_DOMAIN: ${CAREERSCOPE_DOMAIN:?Domain required}
      CAREERSCOPE_TLS_MODE: ${CAREERSCOPE_TLS_MODE:?TLS mode required}
      CAREERSCOPE_UPSTREAM: 127.0.0.1:5280
      CAREERSCOPE_STAGING_USER: ${CAREERSCOPE_STAGING_USER:?Staging user required}
      CAREERSCOPE_STAGING_PASSWORD_HASH: ${CAREERSCOPE_STAGING_PASSWORD_HASH:?Staging password hash required}
      CAREERSCOPE_STAGING_PROXY_KEY: ${CAREERSCOPE_STAGING_PROXY_KEY:?Private staging proxy assertion required}
    volumes:
      - '../caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro'
      # Issued certificates and ACME account keys must survive restarts,
      # otherwise every restart re-requests and burns issuance quota.
      - 'certificates:/data'
      - 'proxyconfig:/config'
      # Operator-controlled maintenance flag and page. Read-only to the proxy so
      # a compromised proxy cannot enable or disable maintenance.
      - '${CAREERSCOPE_MAINTENANCE_DIR:-/srv/maintenance}:/srv/maintenance:ro'
    tmpfs: ['/tmp:size=16m,mode=1777']
    cpus: 1
    mem_limit: 256m

  postgres:
    <<: *hardening
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    user: postgres
    network_mode: service:network-anchor
    command: ['postgres', '-c', 'listen_addresses=127.0.0.1']
    environment:
      DEPLOYMENT_ENVIRONMENT: production
      POSTGRES_DB: careerscope
      POSTGRES_USER: careerscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes: ['database:/var/lib/postgresql/data']
    tmpfs: ['/tmp:size=64m,mode=1777', '/var/run/postgresql:size=8m,uid=70,gid=70,mode=0775']
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'careerscope', '-d', 'careerscope']
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    <<: *hardening
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    user: redis
    network_mode: service:network-anchor
    environment:
      DEPLOYMENT_ENVIRONMENT: production
    secrets:
      - source: redis-config
        target: redis.conf
    command:
      [
        'redis-server',
        '/run/secrets/redis.conf',
        '--bind',
        '127.0.0.1',
        '--save',
        '',
        '--maxmemory',
        '192mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$(cut -d " " -f2 /run/secrets/redis.conf)" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Persistent Redis queue endpoint. Delivery is a hint only: the transactional
  # outbox in Postgres is the source of truth and reconciles anything the queue
  # loses; AOF and noeviction additionally protect queued work.
  redis-queue:
    <<: *hardening
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    user: redis
    network_mode: service:network-anchor
    environment:
      DEPLOYMENT_ENVIRONMENT: production
    secrets:
      - source: redis-queue-config
        target: redis.conf
    command:
      [
        'redis-server',
        '/run/secrets/redis.conf',
        '--bind',
        '127.0.0.1',
        '--port',
        '6380',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory',
        '192mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes: [queue-data:/data]
    mem_limit: 384m
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$(cut -d " " -f2 /run/secrets/redis.conf)" redis-cli -p 6380 ping | grep -q PONG',
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  bootstrap:
    <<: *hardening
    image: ${CAREERSCOPE_IMAGE:?Runtime image required (immutable digest or revision tag)}
    user: '1000:1000'
    network_mode: service:network-anchor
    environment: *environment
    restart: 'no'
    command: ['node', '/app/bootstrap.mjs']
    volumes:
      - 'private:/private'
      - '../host/bootstrap.mjs:/app/bootstrap.mjs:ro'
      - '../host/resume-key.mjs:/app/resume-key.mjs:ro'
    cpus: 1
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    environment:
      <<: *environment
      DEPLOYMENT_ENVIRONMENT: production
      TEST_ACCESS_MODE: disabled
    command: ['node', 'apps/api/dist/main.js']
    volumes: ['private:/private']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5390/api/health').then(response=>process.exit(response.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  publisher:
    <<: *app
    command: ['node', 'apps/workers/search/dist/publisher.js']

  search:
    <<: *app
    command: ['node', 'apps/workers/search/dist/main.js']

  files:
    <<: *app
    command: ['node', 'apps/workers/search/dist/files.js']
    volumes: ['private:/private:ro']

  web:
    <<: *app
    environment: *web-environment
    working_dir: /app/apps/web
    command:
      [
        'node',
        '/app/node_modules/next/dist/bin/next',
        'start',
        '--hostname',
        '127.0.0.1',
        '--port',
        '5280',
      ]
    tmpfs:
      ['/tmp:size=64m,mode=1777', '/app/apps/web/.next/cache:size=64m,uid=1000,gid=1000,mode=0700']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5280/').then(response=>process.exit(response.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

# The Redis password reaches the Redis containers as a file, never as a command-line argument
# or an environment variable, so it is absent from `docker inspect` and the process list.
# `bash infra/host/render-redis-config.sh` writes these files from REDIS_PASSWORD in infra/.env.
secrets:
  redis-config:
    file: ../.env.secrets/redis.conf
  redis-queue-config:
    file: ../.env.secrets/redis-queue.conf

volumes:
  queue-data:
  database:
  private:
  certificates:
  proxyconfig:
