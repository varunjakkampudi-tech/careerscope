<!doctype html>
<html lang="en" data-variant="editorial">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Latest jobs | CareerScope — Variant B: Editorial Calm</title>
    <style>
      /* Variant B — Editorial Calm.
         Optimises for legibility and confidence per row. Gives up rows-on-screen. */
      :root {
        color-scheme: dark light;
        --bg: #0f1115;
        --panel: #151922;
        --line: #262d39;
        --ink: #eef2f7;
        --muted: #949fb0;
        --accent: #7cc4a0;
        --save: #e6b95c;
        --gutter: clamp(16px, 5vw, 56px);
        --measure: 72ch;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      html[data-theme='light'] {
        --bg: #fcfcfa;
        --panel: #fff;
        --line: #e3e3dd;
        --ink: #14171c;
        --muted: #5d6673;
        --accent: #1d7a54;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-size: 16px;
        line-height: 1.5;
      }
      a {
        color: inherit;
      }
      .skip {
        position: absolute;
        left: -9999px;
      }
      .skip:focus {
        left: var(--gutter);
        top: 10px;
        background: var(--accent);
        color: #06120c;
        padding: 8px 12px;
        z-index: 10;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 var(--gutter);
      }

      header {
        border-bottom: 1px solid var(--line);
        padding: 40px 0 20px;
      }
      h1 {
        font-size: clamp(30px, 5vw, 46px);
        letter-spacing: -0.02em;
        line-height: 1.08;
        margin: 0 0 8px;
      }
      .lede {
        color: var(--muted);
        margin: 0 0 24px;
        max-width: 52ch;
      }
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        padding-bottom: 18px;
      }
      button,
      .btn {
        font: inherit;
        font-size: 14px;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 15px;
        cursor: pointer;
        text-decoration: none;
      }
      button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: #06120c;
      }
      html[data-theme='light'] button[aria-pressed='true'] {
        color: #fff;
      }
      input[type='search'] {
        font: inherit;
        font-size: 14px;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 15px;
        min-width: 220px;
      }
      .grow {
        flex: 1;
      }
      .count {
        color: var(--muted);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 20px;
        padding: 22px 0;
        border-bottom: 1px solid var(--line);
        align-items: start;
      }
      .t {
        grid-row: 1;
        grid-column: 1;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
        max-width: var(--measure);
      }
      .c,
      .l,
      .s {
        display: none;
      }
      .t a {
        text-decoration: none;
      }
      .t a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .meta {
        grid-row: 2;
        grid-column: 1;
        color: var(--muted);
        font-size: 14.5px;
      }
      .meta b {
        color: var(--ink);
        font-weight: 600;
      }
      .sep {
        opacity: 0.5;
        padding: 0 7px;
      }
      .age {
        grid-row: 1;
        grid-column: 2;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .age.fresh {
        color: var(--accent);
      }
      .star {
        grid-row: 2;
        grid-column: 2;
        border: 0;
        padding: 0;
        background: none;
        font-size: 18px;
        color: var(--muted);
        justify-self: end;
      }
      .star[aria-pressed='true'] {
        color: var(--save);
      }
      .state {
        padding: 90px 0;
        text-align: center;
        color: var(--muted);
      }
      .state b {
        display: block;
        font-size: 21px;
        color: var(--ink);
        margin-bottom: 8px;
      }
      .sk {
        height: 86px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(
          90deg,
          transparent,
          color-mix(in srgb, var(--line) 70%, transparent),
          transparent
        );
        background-size: 200% 100%;
        animation: sh 1.2s linear infinite;
      }
      @keyframes sh {
        to {
          background-position: -200% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk {
          animation: none;
        }
      }
      footer {
        padding: 30px 0 70px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .head {
        display: none;
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="wrap">
      <header>
        <h1>Latest jobs</h1>
        <p class="lede">
          Every role CareerScope has found, newest first. Open what looks right — nothing here is an
          application.
        </p>
        <div class="controls">
          <input
            type="search"
            id="q"
            placeholder="Filter title or company"
            aria-label="Filter jobs"
          />
          <button id="all" aria-pressed="true">All jobs</button>
          <button id="saved" aria-pressed="false">Saved</button>
          <button id="clearf">Clear filters</button>
          <span class="grow"></span>
          <span class="count" id="count">—</span>
          <button id="theme" aria-label="Theme: dark">◐</button>
          <a class="btn" href="#">Download</a>
          <a class="btn" href="#">Admin login</a>
        </div>
      </header>
      <main id="main"><div id="list"></div></main>
      <footer><button id="more">Load more</button><span class="count" id="shown"></span></footer>
    </div>
    <script type="module" src="./variant.js"></script>
  </body>
</html>
