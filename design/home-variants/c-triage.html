<!doctype html>
<html lang="en" data-variant="cards">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Latest jobs | CareerScope — Variant C: Structured Triage</title>
    <style>
      /* Variant C — Structured Triage.
         Optimises for returning daily and filtering fast. Gives up peak density
         and adds a persistent sidebar that costs width. */
      :root {
        color-scheme: dark light;
        --bg: #0c1017;
        --panel: #141a24;
        --card: #161d28;
        --line: #232c3a;
        --ink: #e9eef6;
        --muted: #8e9bad;
        --accent: #7aa2f7;
        --save: #e0af68;
        --gutter: 18px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      html[data-theme='light'] {
        --bg: #f6f8fb;
        --panel: #fff;
        --card: #fff;
        --line: #dde4ee;
        --ink: #111822;
        --muted: #59657a;
        --accent: #2d5fd0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.45;
      }
      a {
        color: inherit;
      }
      .skip {
        position: absolute;
        left: -9999px;
      }
      .skip:focus {
        left: 16px;
        top: 10px;
        background: var(--accent);
        color: #041020;
        padding: 8px 12px;
        z-index: 10;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        padding: 12px var(--gutter);
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 17px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .count {
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .grow {
        flex: 1;
      }
      button,
      .btn {
        font: inherit;
        font-size: 13.5px;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
        text-decoration: none;
      }
      button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: #041020;
      }
      html[data-theme='light'] button[aria-pressed='true'] {
        color: #fff;
      }
      input[type='search'] {
        font: inherit;
        font-size: 13.5px;
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 6px 12px;
        min-width: 210px;
      }

      .shell {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        gap: 20px;
        padding: 20px var(--gutter) 60px;
        max-width: 1400px;
        margin: 0 auto;
      }
      aside {
        position: sticky;
        top: 74px;
        align-self: start;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
      }
      aside h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      aside .grp {
        margin-bottom: 16px;
      }
      aside button {
        display: flex;
        width: 100%;
        justify-content: space-between;
        border: 0;
        padding: 6px 8px;
        border-radius: 6px;
        color: var(--muted);
      }
      aside button:hover {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--ink);
      }
      aside button[aria-pressed='true'] {
        background: color-mix(in srgb, var(--accent) 20%, transparent);
        color: var(--ink);
      }

      #list {
        display: grid;
        gap: 10px;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 4px 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 13px 15px;
      }
      .row:hover {
        border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      }
      .t {
        grid-row: 1;
        grid-column: 1;
        font-size: 15.5px;
        font-weight: 650;
      }
      .t a {
        text-decoration: none;
      }
      .t a:hover {
        text-decoration: underline;
      }
      .meta {
        grid-row: 2;
        grid-column: 1;
        color: var(--muted);
        font-size: 13.5px;
      }
      .c,
      .l,
      .s {
        display: none;
      }
      .age {
        grid-row: 1;
        grid-column: 2;
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .age.fresh {
        color: var(--accent);
        font-weight: 600;
      }
      .star {
        grid-row: 2;
        grid-column: 2;
        justify-self: end;
        border: 0;
        background: none;
        padding: 0;
        font-size: 17px;
        color: var(--muted);
      }
      .star[aria-pressed='true'] {
        color: var(--save);
      }

      .state {
        padding: 70px 20px;
        text-align: center;
        color: var(--muted);
        background: var(--card);
        border: 1px dashed var(--line);
        border-radius: 12px;
      }
      .state b {
        display: block;
        font-size: 18px;
        color: var(--ink);
        margin-bottom: 6px;
      }
      .sk {
        height: 74px;
        border-radius: 11px;
        background: linear-gradient(
          90deg,
          var(--card),
          color-mix(in srgb, var(--line) 75%, var(--card)),
          var(--card)
        );
        background-size: 200% 100%;
        animation: sh 1.15s linear infinite;
        margin-bottom: 10px;
      }
      @keyframes sh {
        to {
          background-position: -200% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk {
          animation: none;
        }
      }
      footer {
        grid-column: 2;
        display: flex;
        gap: 12px;
        align-items: center;
        padding-top: 16px;
      }
      .head {
        display: none;
      }
      .vh {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      .rows {
        list-style: none;
        margin: 0;
        padding: 0;
        display: contents;
      }
      .n {
        font-variant-numeric: tabular-nums;
      }

      @media (max-width: 880px) {
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }
        aside {
          position: static;
          order: -1;
        }
        footer {
          grid-column: 1;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <h1>Latest jobs</h1>
      <span class="count" id="count">—</span>
      <span class="grow"></span>
      <input type="search" id="q" placeholder="Filter title or company" aria-label="Filter jobs" />
      <button id="theme" aria-label="Theme: dark">◐</button>
      <a class="btn" href="#">Download</a>
      <a class="btn" href="#">Admin login</a>
    </header>
    <div class="shell">
      <aside aria-label="Filters">
        <div class="grp">
          <h2>Show</h2>
          <button id="all" aria-pressed="true">All jobs</button>
          <button id="saved" aria-pressed="false">Saved</button>
        </div>
        <div class="grp">
          <h2>Sources</h2>
          <div id="sources"></div>
        </div>
        <button id="clearf">Clear filters</button>
      </aside>
      <main id="main"><div id="list"></div></main>
      <p id="live" class="vh" role="status" aria-live="polite"></p>
      <footer><button id="more">Load more</button><span class="count" id="shown"></span></footer>
    </div>
    <script type="module" src="./variant.js"></script>
  </body>
</html>
