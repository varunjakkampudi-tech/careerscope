<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home page variants | CareerScope design review</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0d12;
        --panel: #12161d;
        --line: #232a35;
        --ink: #e7edf5;
        --muted: #8d99ab;
        --accent: #6aa9ff;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 13px;
        margin: 0;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      label {
        font-size: 12.5px;
        color: var(--muted);
        display: inline-flex;
        gap: 7px;
        align-items: center;
      }
      select,
      button {
        font: inherit;
        font-size: 13px;
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 6px 10px;
      }
      select:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .grow {
        flex: 1;
      }
      .note {
        font-size: 12px;
        color: var(--muted);
      }
      .stage {
        flex: 1;
        overflow: auto;
        display: grid;
        place-items: start center;
        padding: 18px;
        background:
          repeating-linear-gradient(
            45deg,
            transparent 0 10px,
            rgba(255, 255, 255, 0.015) 10px 20px
          ),
          var(--bg);
      }
      .frame {
        background: #000;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
        transition: width 0.18s ease;
      }
      iframe {
        display: block;
        border: 0;
        width: 100%;
        height: min(88vh, 1200px);
        background: #fff;
      }
      @media (prefers-reduced-motion: reduce) {
        .frame {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Home page variants</h1>
      <label
        >Variant
        <select id="variant">
          <option value="refined-dark.html" selected>1 — Refined dark</option>
        </select>
      </label>
      <label
        >Width
        <select id="width">
          <option value="320">320 — small phone</option>
          <option value="390" selected>390 — phone</option>
          <option value="768">768 — tablet</option>
          <option value="1024">1024 — laptop</option>
          <option value="1440">1440 — desktop</option>
          <option value="0">Fill</option>
        </select>
      </label>
      <button id="reload" type="button">Reload</button>
      <a id="open" class="note" href="./refined-dark.html" target="_blank" rel="noopener"
        >Open standalone</a
      >
      <span class="grow"></span>
      <span class="note" id="status">—</span>
    </header>
    <div class="stage">
      <div class="frame" id="frame">
        <iframe id="view" title="Variant preview" src="./refined-dark.html"></iframe>
      </div>
    </div>
    <script type="module">
      const $ = (id) => document.getElementById(id);
      const view = $('view');
      const frame = $('frame');

      const apply = () => {
        const src = $('variant').value;
        const w = Number($('width').value);
        frame.style.width = w ? `${w}px` : '100%';
        if (!view.src.endsWith(src)) view.src = `./${src}`;
        $('open').href = `./${src}`;
        $('status').textContent = `${src} at ${w ? `${w}px` : 'full width'}`;
        // Survive a reload so a review session does not restart at variant A.
        sessionStorage.setItem('cs-variant', JSON.stringify({ src, w }));
      };

      try {
        const saved = JSON.parse(sessionStorage.getItem('cs-variant') ?? 'null');
        if (saved) {
          $('variant').value = saved.src;
          $('width').value = String(saved.w);
        }
      } catch {
        // A corrupt preference is not worth failing the page for.
      }

      $('variant').addEventListener('change', apply);
      $('width').addEventListener('change', apply);
      $('reload').addEventListener('click', () => {
        view.src = view.src;
      });
      apply();
    </script>
  </body>
</html>
