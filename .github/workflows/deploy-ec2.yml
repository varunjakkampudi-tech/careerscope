name: Deploy API to EC2

# Ships the API (and, on this host, the SPA it serves) to a single EC2 box
# running the compose stack in infra/docker-compose.yml.
#
# Manual-only while the Docker/EC2 acceptance gates remain unverified.
# ENABLE_EC2_DEPLOY must be explicitly enabled before any manual run can deploy.
#
# One-time setup, under Settings → Secrets and variables → Actions:
#
#   Secrets
#     EC2_SSH_KEY      private key for a deploy user (`ssh-keygen -t ed25519`),
#                      its public half in ~/.ssh/authorized_keys on the box
#     EC2_HOST         hostname or IP
#     EC2_USER         login user; must be in the `docker` group
#     EC2_KNOWN_HOSTS  output of `ssh-keyscan -H <host>`, run from a machine
#                      you trust. Without it the deploy is one DNS hijack away
#                      from handing the key to whoever answers.
#   Variables (optional)
#     EC2_APP_DIR      checkout path on the box; defaults to /opt/job-radar
#
# On the box, once: clone the repo to EC2_APP_DIR, write .env there (it is
# gitignored and never travels through CI), and make sure the deploy user owns
# the directory. Full walkthrough in docs/RUNBOOK.md.

on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. Not cancel-in-progress: interrupting a run mid
# `docker compose up` can leave the stack half-replaced.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: ${{ vars.ENABLE_EC2_DEPLOY == 'true' }}

    steps:
      # No third-party SSH action: this step holds a private key with shell
      # access to production, and a dependency there is a supply-chain risk
      # that buys nothing ssh(1) does not already do.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::EC2_SSH_KEY and EC2_KNOWN_HOSTS must both be set."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/job-radar' }}
        run: |
          set -euo pipefail

          # The remote script is fed over stdin rather than passed as an
          # argument, so nothing in it is expanded by the local shell first.
          # `bash -s -- "$APP_DIR"` hands the path in as $1 on the far side.
          ssh -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=20 \
              -i "$HOME/.ssh/deploy_key" \
              "$EC2_USER@$EC2_HOST" bash -s -- "$APP_DIR" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          cd "$app_dir"

          # .env lives only on the box — provider keys and APP_API_KEY are not
          # in the repo and must not pass through CI. Without it the container
          # boots, fails env parsing and restart-loops, which is a confusing
          # way to discover a missing file.
          if [ ! -f .env ]; then
            echo "No .env at $app_dir/.env — see docs/RUNBOOK.md" >&2
            exit 1
          fi

          git fetch --prune origin

          # Reset to origin/main rather than to a pinned SHA. If two deploys
          # overlap, both land on whatever main is at that moment, so the box
          # ends up on the newest commit regardless of which run finishes last
          # — a pinned SHA would let a slow older run overwrite a newer one.
          git reset --hard origin/main
          echo "Deploying $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"

          docker compose -f infra/docker-compose.yml up -d --build

          # Untagged layers from previous builds. An 8 GB root volume fills in
          # about a dozen deploys without this.
          docker image prune -f

          # Health-checked through nginx on localhost, which covers both the
          # container and the proxy in front of it. Public DNS and TLS are
          # deployment-independent and are checked in the runbook instead.
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/api/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" != 1 ]; then
            echo "Health check failed after 60s. Recent logs:" >&2
            docker compose -f infra/docker-compose.yml logs --tail 80 >&2
            exit 1
          fi

          curl -fsS http://127.0.0.1/api/health
          echo
          docker compose -f infra/docker-compose.yml ps
          REMOTE

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
