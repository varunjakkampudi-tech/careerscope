name: Publish Pages

# Publication is deliberately manual. CI validates and stages the same assets,
# but no push, pull request, schedule, or upstream workflow may publish them.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or full commit SHA to publish'
        required: true
        default: 'main'
        type: string
      environment:
        description: 'GitHub Pages environment whose approvals apply'
        required: true
        default: 'github-pages'
        type: choice
        options:
          - github-pages

concurrency:
  group: pages-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '24'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  publish:
    name: Validate and publish the selected revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve the revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Require CI success for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.rev.outputs.sha }}
        run: node scripts/require-ci-success.mjs

      - name: Install
        run: npm ci

      - name: Validate and stage Pages assets
        run: |
          npm run version:check
          npm run pages:test
          npm run pages:stage
          npm run pages:workspace:test

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the validated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Report the published revision
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          SHA: ${{ steps.rev.outputs.sha }}
        run: |
          printf '## Published Pages\n\n- Revision: `%s`\n- URL: %s\n' "$SHA" "$PAGES_URL" >>"$GITHUB_STEP_SUMMARY"
