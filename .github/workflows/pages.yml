name: Deploy public mobile jobs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate static site security and theme
        run: node --test scripts/export-mobile.test.mjs scripts/export-admin.test.mjs scripts/snapshot-crypto.test.mjs scripts/theme.test.mjs scripts/stage-pages.test.mjs
      - uses: actions/configure-pages@v5
      - name: Stage only public mobile files
        run: node scripts/stage-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
