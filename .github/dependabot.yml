version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: dev
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: 'build(deps)'
